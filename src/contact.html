---
layout: layout.html
permalink: /contact/
title: Contact
description: Get in touch with CraicCove Games.
---
<section class="page-head">
  <h1>Get In Touch</h1>
  <p>Press, collaborations, or just to say hello.</p>
</section>

<section class="section navy">
  {% if site.formspree_id != "" %}
  <form class="form" action="https://formspree.io/f/{{ site.formspree_id }}" method="POST">
    <input type="hidden" name="_subject" value="Message via craiccovegames.com">
    <label>Name <input type="text" name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Message <textarea name="message" required></textarea></label>
    <div><button class="btn" type="submit">Send</button></div>
  </form>
  <p style="text-align: center; margin-top: 32px; color: var(--muted);">Or email <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  {% else %}
  <div class="narrow" style="text-align: center;">
    <p class="statement">{{ site.location }}</p>
    <p style="margin-top: 24px;"><a class="btn" href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </div>
  {% endif %}
</section>
