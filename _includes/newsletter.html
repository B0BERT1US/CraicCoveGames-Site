{% assign s = site.data.site %}
<section class="band">
  <div class="wrap">
    <h2>{{ s.newsletter.heading }}</h2>
    <div class="rule"></div>
  </div>
</section>
<section class="section bg-navy">
  <div class="form-box" style="padding:0;border:0;background:transparent">
    {% if s.newsletter.form_embed_url != "" %}
    <iframe src="{{ s.newsletter.form_embed_url }}" style="min-height:420px" title="Newsletter signup">Loading</iframe>
    {% else %}
    <div class="form-missing">Newsletter signup goes here. Make a Google Form with one email question, then paste its embed link into _data/site.yml under newsletter.</div>
    {% endif %}
    <p style="text-align:center;margin-top:14px;font-size:15px;color:#8A98AC">{{ s.newsletter.small_print }}</p>
  </div>
</section>
