project:
  heading: "Our Current Project"
  hook: "Arrest or kill. The machine decides."
  blurb: "A tactical FPS where you are a police robot, an experiment built to replace the human force. Every mission is a test. Your choices decide whether the experiment succeeds or gets shut down."
  button_1: "Find Out More"
  button_2: "Wishlist On Steam"

about_heading: "About Us"

name_section:
  heading: "The Name"
  columns:
    - title: "Craic"
      text: "Craic is an Irish slang word that means fun. We wanted it in the name to represent the country we proudly come from."
    - title: "Cove"
      text: "A cove is a small sheltered bay, a safe spot where boats pull in out of the weather. A place for fun, real stories and good times. That is what we want our studio to represent."
    - title: "Games"
      text: "The obvious part of the name. We could have said studio or interactive, but we did not. Games are our passion and games are what we will make."

mission:
  heading: "Our Mission"
  statement: "At CraicCove Games we make games about modern problems. We hand the controls to the player and let them explore the possible solutions, because you understand an issue differently once you have had to make the call yourself."
  columns:
    - title: "Real Issues"
      text: "Before we make a game we find an issue going on in the real world. Something real, not fantasy."
    - title: "Your Control"
      text: "Then we work out how to look at that issue from inside a game, and hand the controls to the player to decide how it moves forward."
    - title: "Good Craic"
      text: "We do not set out to make a lecture. We make it fun to play, or the message does not land. Fun first, then the point."

team:
