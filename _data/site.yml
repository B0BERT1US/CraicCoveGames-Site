# ---------- Identity Protocol page ----------
game:
  title: "Identity Protocol"
  hook: "Arrest or kill. The machine decides."
  intro: "You are an experimental police robot being trained to replace the human force. Each mission is a situation with more than one way through it. How you handle it decides whether the experiment survives."
  pillars:
    - title: "Brute Force"
      text: "Go in loud. Fast, effective, and the suspects remember it."
    - title: "Tactical"
      text: "Plan the approach, control the room, nobody needs to get hurt."
    - title: "Negotiation"
      text: "Talk them down. Slower, riskier, and the only way some of them come out alive."
  squad: "A hive mind of up to four robot units under your control. One mind, four bodies, every decision shared."

